<!DOCTYPE html>

<head>

    <!-- Load React, ReactDOM and Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #059669; }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide-in-bottom { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .animate-in { animation: fade-in 0.3s ease-out; }
        .slide-in-from-bottom-4 { animation: slide-in-bottom 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            box-shadow: 0 0 2px 0 rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const apiKey = "";

        const Icon = ({ name, className, size = 16 }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        async function callGemini(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "You are an expert Cancun travel specialist." }] }
            };

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error();
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) {
                    if (i === 4) throw err;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

            { id: 'f3', airline: "Delta Air Lines", duration: 330, durationStr: "5h 30m", class: "Main Cabin", times: "09:00 AM - 02:30 PM", priceDelta: 85, stops: "Direct" },

                                    <div className="absolute inset-0 flex items-center justify-center bg-slate-900/10">
                                        <button className="bg-slate-900 text-white px-4 py-1.5 rounded-full text-[10px] font-black flex items-center gap-2 shadow-lg group-hover:bg-emerald-600 transition-colors">
                                            <Icon name="map" size={12} /> VIEW MAP
                                        </button>
                                    </div>
                                </div>

                                <div className="mb-6">
                                    <h4 className="font-bold text-slate-900 text-[13px] mb-3">Sort By</h4>
                                    <div className="relative">
                                        <select className="w-full appearance-none bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-700 outline-none focus:border-emerald-500 shadow-sm">
                                            <option>Recommended</option>
                                            <option>Cheapest</option>
                                            <option>Star Level (Highest)</option>
                                            <option>Guest Rating</option>
                                        </select>
                                        <Icon name="chevron-down" className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" size={16} />
                                    </div>
                                </div>

                                <FilterSection title="Neighborhoods" onReset={() => {}}>
                                    <div className="space-y-3">
                                        {['Hotel Zone', 'Tulum', 'Costa Mujeres', 'Riviera Maya'].map(n => (
                                            <label key={n} className="flex justify-between items-center group cursor-pointer">
                                                <div className="flex items-center gap-2">
                                                    <input type="checkbox" className="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />

                                                </div>

                                        ))}

                                </FilterSection>

                                <FilterSection title="Amenities" onReset={() => {}}>

                                <FilterSection title="Stops" onReset={() => {}}>
                                    <div className="space-y-2">

                                            <span>Nonstop</span><span className="opacity-70 font-black">from $275</span>
                                        </button>
                                        <button className="w-full flex justify-between p-3 rounded-2xl border border-slate-200 text-slate-500 font-bold text-[11px] hover:border-emerald-300 transition-colors">
                                            <span>Up to 1 stop</span><span className="opacity-70 font-black">$261</span>
                                        </button>
                                    </div>
                                </FilterSection>

                                <FilterSection title="Airlines" onReset={() => {}}>
                                    <div className="flex justify-between text-[9px] font-black text-blue-600 uppercase mb-4 tracking-tighter">

                                    <div className="space-y-3 max-h-64 overflow-y-auto pr-2 custom-scrollbar">

                                            <label key={i} className="flex justify-between items-center group cursor-pointer">

                                <FilterSection title="Takeoff" onReset={() => {}}>

        const MapView = ({ packages, setViewMode }) => {

                        <div className="absolute inset-0 bg-[radial-gradient(#10b981_1px,transparent_1px)] [background-size:40px_40px] opacity-10"></div>
                        {packages.map((pkg) => (
                            <button key={pkg.id} onClick={() => setActivePackage(pkg)} style={{ left: `${pkg.lat}%`, top: `${pkg.lon}%` }} className={`absolute -translate-x-1/2 -translate-y-1/2 group transition-all duration-500 ${activePackage?.id === pkg.id ? 'z-50 scale-110' : 'z-10'}`}>

                            <div className="flex flex-wrap gap-1.5">
                                {activePackage.hotel.perks.map((p, idx) => (
                                    <span key={idx} className="text-[10px] font-black bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded uppercase tracking-tighter">{p}</span>
                                ))}
                            </div>
                            <button onClick={() => setViewMode('list')} className="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl hover:bg-emerald-700 transition-all">Customize & Book</button>

        const PackageCard = ({ pkg }) => {
            const [selectedFlight, setSelectedFlight] = useState(pkg.defaultFlight);
            const [selectedCar, setSelectedCar] = useState(pkg.defaultCar);
            const [isChangingFlight, setIsChangingFlight] = useState(false);
            const [isChangingCar, setIsChangingCar] = useState(false);
            const [aiContent, setAiContent] = useState(null);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isCopied, setIsCopied] = useState(false);

            const total = pkg.basePrice + selectedFlight.priceDelta + selectedCar.priceDelta;

            const handleShare = () => {
                const mockUrl = `https://cancunbundle.com/share/${pkg.id}?fly=${selectedFlight.id}&car=${selectedCar.id}`;
                const textArea = document.createElement("textarea");
                textArea.value = mockUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                setIsCopied(true);
                setTimeout(() => setIsCopied(false), 2000);
            };

            const getItinerary = async () => {
                setIsModalOpen(true);
                if (aiContent) return;
                setIsAiLoading(true);
                try {
                    const res = await callGemini(`3-day Cancun itinerary staying at ${pkg.hotel.name} with ${selectedCar.model}.`);
                    setAiContent(res);
                } catch { setAiContent("Error generating itinerary."); } finally { setIsAiLoading(false); }
            };

            return (
                <div className="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm hover:shadow-xl transition-all mb-8 overflow-hidden flex flex-col group slide-in-from-bottom-4">
                    <div className="px-6 py-4 bg-slate-50 border-b flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <span className="text-[10px] font-black bg-emerald-600 text-white px-2 py-0.5 rounded-full uppercase tracking-tighter">{pkg.discount}</span>
                            <h3 className="font-bold text-slate-900 text-sm md:text-base">{pkg.destination}</h3>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={handleShare} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-black transition-all border ${isCopied ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white border-slate-200 text-slate-500 hover:border-emerald-600 hover:text-emerald-600'}`}>
                                {isCopied ? <><Icon name="check" size={12} /> COPIED</> : <><Icon name="share-2" size={12} /> SHARE</>}
                            </button>
                            <button onClick={getItinerary} className="flex items-center gap-1.5 px-4 py-1.5 bg-white border border-emerald-100 rounded-full text-[11px] font-black text-emerald-600 shadow-sm hover:bg-emerald-600 hover:text-white transition-all">
                                <Icon name="sparkles" size={14} /> ✨ AI CONCIERGE
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row">
                        {/* HOTEL */}
                        <div className={`flex-1 p-6 border-b lg:border-b-0 lg:border-r border-slate-100 transition-all duration-300 ${isChangingFlight || isChangingCar ? 'opacity-30 blur-[1px]' : ''}`}>
                            <div className="flex items-center gap-2 mb-4 text-emerald-600">
                                <Icon name="hotel" size={16} />
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">The Resort</span>
                            </div>
                            <div className="relative h-44 rounded-3xl overflow-hidden mb-4 shadow-inner">
                                <img src={pkg.hotel.image} className="w-full h-full object-cover group-hover:scale-105 transition-all duration-1000" alt={pkg.hotel.name} />
                                <div className="absolute top-2 right-2 bg-white/90 backdrop-blur-sm px-2 py-1 rounded-lg text-[9px] font-black text-emerald-600 shadow-sm">PLATINUM</div>
                            </div>
                            <h4 className="font-black text-slate-900 text-lg mb-1 leading-tight">{pkg.hotel.name}</h4>
                            <div className="flex items-center gap-1 mb-4">
                                {[...Array(pkg.hotel.stars)].map((_, i) => <Icon key={i} name="star" size={14} className="text-amber-400 fill-amber-400" />)}
                                <span className="text-[10px] font-black text-slate-400 ml-2 uppercase tracking-tighter">Verified Rating</span>
                            </div>
                            <div className="flex flex-wrap gap-1.5">
                                {pkg.hotel.perks.map((p, i) => <span key={i} className="text-[10px] font-bold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-xl shadow-sm">{p}</span>)}
                            </div>
                        </div>

                        {/* FLIGHT */}
                        <div className={`flex-1 p-6 border-b lg:border-b-0 lg:border-r border-slate-100 relative transition-all duration-500 ${isChangingFlight ? 'bg-emerald-50/50 z-10' : (isChangingCar ? 'opacity-30 blur-[1px]' : 'bg-slate-50/20')}`}>
                            <div className="flex justify-between items-center mb-6">
                                <div className="flex items-center gap-2 text-emerald-600">
                                    <Icon name="plane" size={16} />
                                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Included Flight</span>
                                </div>
                                <button onClick={() => setIsChangingFlight(!isChangingFlight)} className="text-[10px] font-black text-emerald-600 uppercase hover:underline">
                                    {isChangingFlight ? <Icon name="x" size={16} /> : <><Icon name="refresh-cw" size={14} /> CHANGE</>}
                                </button>
                            </div>
                            {!isChangingFlight ? (
                                <div className="space-y-6">
                                    <p className="font-black text-slate-900">{selectedFlight.airline}</p>
                                    <div className="flex items-center justify-between gap-6 px-2">
                                        <div className="text-center font-black"><p className="text-sm">07:00</p><p className="text-[9px] text-slate-400 uppercase">DFW</p></div>
                                        <div className="flex-1 border-t-2 border-dashed border-emerald-200 relative"><Icon name="plane" size={16} className="text-emerald-300 absolute left-1/2 -top-2 -translate-x-1/2 bg-white px-1" /></div>
                                        <div className="text-center font-black"><p className="text-sm">12:45</p><p className="text-[9px] text-slate-400 uppercase">CUN</p></div>
                                    </div>
                                    <div className="bg-white p-3 rounded-2xl border border-slate-100 flex justify-between text-[10px] font-black text-emerald-600 uppercase tracking-tighter">
                                        <span>{selectedFlight.stops}</span><span>{selectedFlight.durationStr}</span>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-2 max-h-[240px] overflow-y-auto custom-scrollbar">
                                    {ALTERNATIVE_FLIGHTS.map(f => (
                                        <button key={f.id} onClick={() => { setSelectedFlight(f); setIsChangingFlight(false); }} className={`w-full p-4 rounded-2xl border text-left transition-all ${selectedFlight.id === f.id ? 'bg-white border-emerald-600 ring-1 ring-emerald-600 shadow-md' : 'bg-white border-slate-200 hover:border-emerald-300'}`}>
                                            <div className="flex justify-between items-center mb-1"><span className="text-xs font-black text-slate-900">{f.airline}</span><span className={`text-[10px] font-black ${f.priceDelta >= 0 ? 'text-emerald-600' : 'text-emerald-600'}`}>{f.priceDelta === 0 ? 'INCLUDED' : `$${f.priceDelta}`}</span></div>
                                            <p className="text-[10px] text-slate-400 font-bold uppercase">{f.times} • {f.durationStr}</p>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* CAR */}
                        <div className={`flex-1 p-6 flex flex-col transition-all duration-500 relative ${isChangingCar ? 'bg-emerald-50/50 z-10' : (isChangingFlight ? 'opacity-30 blur-[1px]' : '')}`}>
                            <div className="flex justify-between items-center mb-6">
                                <div className="flex items-center gap-2 text-emerald-600"><Icon name="car" size={16} /><span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Ground Transport</span></div>
                                <button onClick={() => setIsChangingCar(!isChangingCar)} className="text-[10px] font-black text-emerald-600 uppercase hover:underline">{isChangingCar ? <Icon name="x" size={16} /> : 'CHANGE'}</button>
                            </div>
                            {!isChangingCar ? (
                                <div className="flex-1 space-y-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-14 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 shadow-inner"><Icon name="car" size={28} /></div>
                                        <div><h5 className="font-black text-slate-900 text-sm leading-tight">{selectedCar.model}</h5><p className="text-[10px] text-slate-400 font-black uppercase tracking-tighter">{selectedCar.category}</p></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="bg-slate-50 p-3 rounded-2xl text-[10px] font-black text-slate-700 flex items-center gap-2 border border-slate-100"><Icon name="gauge" size={14} className="opacity-40" /> {selectedCar.transmission}</div>
                                        <div className="bg-slate-50 p-3 rounded-2xl text-[10px] font-black text-slate-700 flex items-center gap-2 border border-slate-100"><Icon name="users" size={14} className="opacity-40" /> 5-8 SEATS</div>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-1 space-y-2 max-h-[180px] overflow-y-auto custom-scrollbar">
                                    {ALTERNATIVE_CARS.map(c => <button key={c.id} onClick={() => { setSelectedCar(c); setIsChangingCar(false); }} className={`w-full p-4 rounded-2xl border text-left bg-white transition-all ${selectedCar.id === c.id ? 'border-emerald-600 ring-1 ring-emerald-600 shadow-md' : 'border-slate-200'}`}><span className="text-[11px] font-black text-slate-900 uppercase">{c.model}</span></button>)}
                                </div>
                            )}
                            <div className="mt-8 pt-6 border-t border-slate-100 flex items-end justify-between">
                                <div><p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Bundle Deal</p><p className="text-3xl font-black text-slate-900">${total.toLocaleString()}</p></div>
                                <button disabled={isChangingFlight || isChangingCar} className="bg-emerald-600 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl hover:bg-emerald-700 transition-all shadow-emerald-500/20 active:scale-95">BOOK NOW</button>
                            </div>
                        </div>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-emerald-950/40 backdrop-blur-md animate-in duration-300">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="p-6 border-b flex justify-between items-center bg-slate-50">
                                    <div className="flex items-center gap-3"><Icon name="sparkles" size={20} className="text-emerald-600" /><span className="font-black text-slate-900 uppercase tracking-widest text-sm">Cancun Concierge</span></div>
                                    <button onClick={() => setIsModalOpen(false)}><Icon name="x" size={20} className="text-slate-400" /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-8 text-slate-700 text-sm leading-relaxed custom-scrollbar">
                                    {isAiLoading ? <div className="flex flex-col items-center justify-center h-64 text-center"><Icon name="loader-2" size={40} className="text-emerald-600 animate-spin mb-4" /><p className="text-xs font-black text-slate-400 uppercase tracking-[0.2em]">Planning your Mexican getaway...</p></div> : <div className="whitespace-pre-wrap font-medium">{aiContent}</div>}
                                </div>
                                <div className="p-6 border-t bg-slate-50 flex justify-center"><button onClick={() => setIsModalOpen(false)} className="bg-slate-900 text-white px-8 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest">Got it</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [viewMode, setViewMode] = useState('list');
            const [filters, setFilters] = useState({});

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 overflow-x-hidden">
                    <Header viewMode={viewMode} setViewMode={setViewMode} />
                    
                    {viewMode === 'list' ? (
                        <>
                            <div className="bg-emerald-950 py-12 md:py-16 px-4 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-[600px] h-[600px] bg-emerald-600/20 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/2"></div>
                                <div className="max-w-7xl mx-auto text-center relative z-10">
                                    <h1 className="text-4xl md:text-6xl font-black text-white mb-4 tracking-tighter animate-in fade-in duration-1000">CANCUN <span className="text-emerald-400">UNBUNDLED</span></h1>
                                    <p className="text-emerald-200 font-bold mb-10 text-lg uppercase tracking-[0.3em] opacity-80">Hotel Zone • Costa Mujeres • Riviera Maya</p>
                                    <div className="bg-white p-2 rounded-3xl shadow-2xl flex flex-col md:flex-row gap-1 max-w-4xl mx-auto border-4 border-emerald-900/10">
                                        <div className="flex items-center gap-3 px-6 py-4 md:border-r border-slate-100 flex-1">
                                            <Icon name="map-pin" size={20} className="text-emerald-500" />
                                            <div className="text-left flex flex-col">
                                                <span className="text-[10px] font-black text-slate-400 uppercase">Destination</span>
                                                <span className="text-sm font-black text-slate-900">Cancun, Mexico</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3 px-6 py-4 flex-1">
                                            <Icon name="calendar" size={20} className="text-emerald-500" />
                                            <div className="text-left flex flex-col">
                                                <span className="text-[10px] font-black text-slate-400 uppercase">Travel Dates</span>
                                                <span className="text-sm font-bold text-slate-600">Nov 14 - 21, 2024</span>
                                            </div>
                                        </div>
                                        <button className="bg-emerald-600 text-white px-10 py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-emerald-700 transition-all shadow-xl shadow-emerald-600/20">Search Bundles</button>
                                    </div>
                                </div>
                            </div>

                            <main className="max-w-7xl mx-auto px-4 py-12 flex flex-col md:flex-row items-start relative">
                                <aside className="hidden md:block sticky top-24 self-start max-h-[85vh]">
                                    <SidebarFilters filters={filters} setFilters={setFilters} setViewMode={setViewMode} />
                                </aside>
                                <section className="flex-1 w-full md:pl-8">
                                    <div className="flex items-center justify-between mb-10">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-emerald-100 p-2.5 rounded-2xl text-emerald-600"><Icon name="glass-water" size={24} /></div>
                                            <div>
                                                <h2 className="text-2xl font-black text-slate-900 uppercase tracking-tighter">Curated Escapes</h2>
                                                <p className="text-xs font-bold text-slate-400 uppercase">Available bundles in your region</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        {PACKAGES.map(p => <PackageCard key={p.id} pkg={p} />)}
                                    </div>
                                </section>
                            </main>
                        </>
                    ) : (
                        <MapView packages={PACKAGES} setViewMode={setViewMode} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
